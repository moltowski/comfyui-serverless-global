name: build serverless worker (ComfyUI + global volume)

# Construit l'image du worker et la pousse sur GHCR du propriétaire du dépôt (GITHUB_TOKEN suffit).
# Aucun modèle ni secret dans l'image : les modèles viennent du global volume au réveil du worker.
# Tags : `latest` uniquement depuis main ; une autre branche sort en :<branche> ; toujours :<sha>.
# Épingler le tag :<sha> dans le template RunPod (un hôte qui a déjà un :latest peut le réutiliser).

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'bench/**', 'runpod/**']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/comfyui-serverless-global

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Le runner n'a que ~14 Go libres : on retire les SDK inutiles (piège vécu le 14/07).
      - name: Liberer du disque
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
          # mode=min : mode=max exporte toutes les couches et fait déborder le disque du runner.
          cache-from: type=gha
          cache-to: type=gha,mode=min
